name: Build Debian 13 Appliance Image

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-warden
        run: cargo install cargo-warden --locked
      - name: Build WebUI assets
        run: |
          cd webui
          pnpm install --frozen-lockfile
          pnpm build
      - name: Enable unprivileged userns & netns tools for E2E
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables iproute2 iputils-ping
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Run cargo-warden quality gate
        run: cargo warden gate --format github-actions

  build-image:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install mkosi & Debian image dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            systemd-container systemd-repart systemd-ukify systemd-boot systemd-boot-efi squashfs-tools \
            dosfstools e2fsprogs btrfs-progs cryptsetup-bin cpio kmod zstd xz-utils \
            python3-pefile python3-cryptography python3-pip uidmap \
            ovmf qemu-system-x86 qemu-utils xorriso mtools debian-archive-keyring
          KEYRING_DEB="$(curl -fsSL http://deb.debian.org/debian/pool/main/d/debian-archive-keyring/ | grep -oE 'debian-archive-keyring_[0-9.+~a-zA-Z-]+_all\.deb' | sort -V | tail -n 1)"
          if [[ -n "$KEYRING_DEB" ]]; then
            curl -fsSL "http://deb.debian.org/debian/pool/main/d/debian-archive-keyring/$KEYRING_DEB" -o /tmp/debian-archive-keyring.deb
            sudo dpkg -i /tmp/debian-archive-keyring.deb
          fi
          sudo pip3 install --break-system-packages --upgrade "git+https://github.com/systemd/mkosi.git@v27.1"
          sudo ln -sf /usr/local/bin/mkosi /usr/bin/mkosi
          mkosi --version
      - name: Build release appliance & mkosi UEFI image
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          chmod +x image/mkosi.postinst image/scripts/*.sh
          bash image/scripts/build-image.sh
      - name: Run QEMU/KVM UEFI boot & API E2E test
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod a+rw /dev/kvm || true
          fi
          CRABROUTER_QEMU_TIMEOUT=300 bash image/scripts/e2e-qemu-test.sh
      - name: Compress image artifacts with zstd
        run: |
          cd image/mkosi.output
          find . -maxdepth 1 -type l -delete
          for f in *.raw *.vhdx *.iso *.efi; do
            [[ -f "$f" ]] && zstd -T0 -3 --rm "$f"
          done
          sha256sum *.zst > SHA256SUMS
          ls -lh
      - name: Upload mkosi output artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crabrouter-debian13-image
          compression-level: 0
          path: |
            image/mkosi.output/*.zst
            image/mkosi.output/SHA256SUMS
          if-no-files-found: error
