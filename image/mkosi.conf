[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
Repositories=main,contrib,non-free-firmware

[Output]
Format=disk
CompressOutput=none
SplitArtifacts=yes
Output=crabrouter
OutputDirectory=mkosi.output

[Content]
Hostname=crabrouter
Autologin=no
Bootable=yes
Bootloader=systemd-boot
KernelCommandLine=ro quiet systemd.boot_assessment=1 net.ifnames=0 console=tty0 console=ttyS0,115200
Packages=
    systemd
    systemd-boot
    systemd-boot-efi
    systemd-boot-tools
    systemd-container
    systemd-repart
    systemd-ukify
    linux-image-amd64
    intel-microcode
    amd64-microcode
    firmware-linux-nonfree
    firmware-realtek
    firmware-iwlwifi
    squashfs-tools
    dosfstools
    e2fsprogs
    dbus
    curl
    nftables
    conntrack
    iproute2
    ethtool
    dnsmasq
    dhcpcd-base
    ppp
    wireguard-tools
    miniupnpd-nftables
    ndppd
    chrony
    openssh-server
    tcpdump
    iperf3
    smartmontools
    nvme-cli
    lm-sensors
    hyperv-daemons
    ca-certificates
