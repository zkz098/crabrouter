[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
Repositories=main,contrib,non-free-firmware

[Output]
Format=disk
Bootable=yes
Output=crabrouter
OutputDirectory=mkosi.output
CacheDirectory=mkosi.cache

[Content]
Hostname=crabrouter
Autologin=no
Packages=
    systemd
    systemd-boot
    systemd-ukify
    systemd-sysupdate
    linux-image-amd64
    intel-microcode
    amd64-microcode
    firmware-linux-nonfree
    firmware-realtek
    firmware-iwlwifi
    nftables
    conntrack
    iproute2
    ethtool
    dnsmasq
    dhcpcd-base
    ppp
    wireguard-tools
    chrony
    openssh-server
    tcpdump
    iperf3
    smartmontools
    nvme-cli
    lm-sensors
    ca-certificates
ExtraTrees=mkosi.extra
RepartDirectories=mkosi.repart
SysupdateDirectory=mkosi.sysupdate
