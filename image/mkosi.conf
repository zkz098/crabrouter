[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
Repositories=main,contrib,non-free-firmware

[Output]
Format=disk
SplitArtifacts=yes
Output=crabrouter
OutputDirectory=mkosi.output
CacheDirectory=mkosi.cache
RepartDirectories=mkosi.repart

[Build]
BuildDirectory=mkosi.builddir
WorkspaceDirectory=mkosi.workspace

[Content]
Hostname=crabrouter
Autologin=no
Bootable=yes
Bootloader=systemd-boot
KernelCommandLine=ro quiet systemd.boot_assessment=1
Packages=
    systemd
    systemd-boot
    systemd-boot-efi
    systemd-ukify
    systemd-sysupdate
    linux-image-amd64
    intel-microcode
    amd64-microcode
    firmware-linux-nonfree
    firmware-realtek
    firmware-iwlwifi
    squashfs-tools
    dosfstools
    e2fsprogs
    dbus
    curl
    nftables
    conntrack
    iproute2
    ethtool
    dnsmasq
    dhcpcd-base
    ppp
    wireguard-tools
    chrony
    openssh-server
    tcpdump
    iperf3
    smartmontools
    nvme-cli
    lm-sensors
    hyperv-daemons
    ca-certificates
ExtraTrees=mkosi.extra
